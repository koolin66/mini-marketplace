services:
  # --- Инфраструктура ---
  orders-postgres:
    image: postgres:16-alpine
    container_name: orders-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "5433:5432"
    volumes:
      - orders_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    ports:
      - "5434:5432"
    volumes:
      - inventory_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-postgres:
    image: postgres:16-alpine
    container_name: notification-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications
    ports:
      - "5435:5432"
    volumes:
      - notification_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      # ИЗМЕНЕНО: было localhost:9092 — теперь kafka:9092, потому что теперь
      # клиенты (наши Go-сервисы) ТОЖЕ внутри Docker-сети, обращаются по имени "kafka",
      # не с хост-машины напрямую. Если оставить localhost — контейнеры не смогут подключиться.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Order Service ---
  order-service:
    build:
      context: ./order-service
      target: order-service
    container_name: order-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@orders-postgres:5432/orders?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      HTTP_PORT: 8081
      GRPC_PORT: 9091
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      orders-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-outbox-worker:
    build:
      context: ./order-service
      target: outbox-worker
    container_name: order-outbox-worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@orders-postgres:5432/orders?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      orders-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # --- API Gateway ---
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    environment:
      ORDER_SERVICE_GRPC_ADDR: order-service:9091
      REDIS_ADDR: redis:6379
      HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - order-service
      - redis

  # --- Inventory Service ---
  inventory-service:
    build:
      context: ./inventory-service
      target: inventory-service
    container_name: inventory-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@inventory-postgres:5432/inventory?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      inventory-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inventory-outbox-worker:
    build:
      context: ./inventory-service
      target: inventory-outbox-worker
    container_name: inventory-outbox-worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@inventory-postgres:5432/inventory?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      inventory-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # --- Notification Service ---
  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    environment:
      DATABASE_URL: postgres://postgres:postgres@notification-postgres:5432/notifications?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      notification-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  orders_pg_data:
  inventory_pg_data:
  notification_pg_data:
  kafka_data: