global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8081']

  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory-service:9100']

  - job_name: 'inventory-outbox-worker'
    static_configs:
      - targets: ['inventory-outbox-worker:9101']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:9102']